openapi: 3.1.0
info:
  title: example-service API
  version: 1.0.0
  description: 契约脚手架（自包含示例；形状用，不含真实主机与凭据）
servers:
  - url: https://api.example.com/v1
security:
  - bearer_auth: []
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: 列出部件（游标分页 + 稳定排序）
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page_token
          in: query
          schema:
            type: string
            maxLength: 256
        - name: order_by
          in: query
          schema:
            type: string
            default: id asc
      responses:
        "200":
          description: 一页部件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: 触发限流（重试须读 Retry-After）
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      operationId: createWidget
      summary: 创建部件（幂等键必填）
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetInput"
      responses:
        "201":
          description: 已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /widgets/{id}:
    delete:
      operationId: deleteWidget
      summary: 删除部件（无返回数据用 204）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          schema:
            type: string
      responses:
        "204":
          description: 已删除，无响应体
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 错误信封（全 API 共用，字段级错误列全）
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: urn:example:error:internal
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: 请求关联 id，不含内部信息
        errors:
          type: array
          items:
            type: object
            required: [code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
              retryable:
                type: boolean
    Widget:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          pattern: ^wid_[A-Za-z0-9]+$
        name:
          type: string
          minLength: 1
          maxLength: 200
        price_minor_units:
          type: integer
          description: 金额用最小货币单位整数，避免浮点误差
        created_at:
          type: string
          format: date-time
        legacy_name:
          type: string
          deprecated: true
    WidgetInput:
      type: object
      required: [name, price_minor_units]
      properties:
        name:
          type: string
          maxLength: 200
        price_minor_units:
          type: integer
          minimum: 0
    WidgetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
        next_page_token:
          type:
            - string
            - "null"
          description: 无更多数据时为 null
        total_size_estimated:
          type:
            - integer
            - "null"
  responses:
    ValidationError:
      description: 校验失败（列出全部失败字段）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: 凭据缺失或无效（不重试）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: 幂等键冲突或版本不符
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
